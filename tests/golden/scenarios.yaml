# Golden scenarios: DATA driving the legacy webhook, in order, on one shared DB.
# Each step posts one LINE event to POST /callback/<secret>/<token> (or a raw
# HTTP check) and captures outbound reply/push payloads plus key DB effects.
#
# Step fields:
#   name:      unique id, also used as golden key
#   kind:      text | sticker | image | follow | unfollow | join | leave |
#              postback | ping | bad_signature | missing_signature
#   source:    {kind: group|room|user, id: <group/room id>, user: <user id>}
#              (text/sticker/image only)
#   text:      message text (text only)
#   head_map:  {url: content-type} overrides for image HEAD checks (this step)
#   random_org: [ints] served back for random.org multi-draw (this step)
#   safe_browsing: clean | threat (this step; group URL path only)
#   seed:      random.seed before the step (default 1)
#   db:        [keywords | settings | counts] DB slices captured after the step
#
# Reply-token values are synthetic per step (rt-<n>); the golden file stores
# the recorded (kind, target, messages) tuples where kind is reply|push and
# messages are the exact as_json_dict() payloads sent toward LINE.
#
# NOTE on time: 愛醬安靜 replies embed a local sleep-until timestamp, so the
# golden records it as captured. It is the only wall-clock value in goldens.

defaults:
  seed: 1
  safe_browsing: clean

