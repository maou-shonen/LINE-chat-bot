# NAS stack: /volume2/docker/stacks/line-chat-bot
# Ingress: cloudflared reaches this service at http://line-chat-bot:8000.
# Setup: chmod 600 .env; mkdir data && chown 1026:100 data
# One-shot migrate BEFORE cutover (needs ~300 MiB; the migrate service
# below has no mem_limit so the 256m of the server never applies to it):
#   docker compose --profile migrate run --rm -v /path/to/dump:/in:ro migrate \
#     python -m app.migrate --from-dump /in/<file> --to /data/line.db [--parity-sample 200]
# Health: container HEALTHCHECK probes /ping (see Dockerfile);
# the migrate helper disables it (no server is running there).

services:
  line-chat-bot:
    container_name: line-chat-bot
    # Pin to sha-<short> or digest for prod.
    image: &bot-image ghcr.io/maou-shonen/line-chat-bot:migrate
    user: "1026:100"
    env_file: .env
    restart: unless-stopped
    environment:
      TZ: Asia/Taipei
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    mem_limit: 256m
    networks:
      - public
  migrate:
    image: *bot-image
    profiles: ["migrate"]
    user: "1026:100"
    volumes:
      - ./data:/data
    healthcheck:
      disable: true
    network_mode: none
networks:
  public:
    external: true
