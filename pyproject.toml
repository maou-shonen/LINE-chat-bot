[project]
name = "line-chat-bot"
version = "1.0.0"
description = "LINE keyword bot (FastAPI on CPython 3.13)"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "pydantic-settings>=2.0",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "loguru>=0.7",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/*.py" = ["E721"]
